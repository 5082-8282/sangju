<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>전시 상주 시간표 · 목방</title>
<meta name="theme-color" content="#434341">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fastly.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap">
<style>
/* 목방 제40회 전시회 '온각' 포스터에서 가져온 색: 숯색 바탕, 세이지 글씨, 토프 한자, 빛줄기 */
/* 포스터 글꼴(G마켓 산스): 컴퓨터에 깔려 있으면 그걸 쓰고, 없으면 인터넷에서 받아요 */
@font-face{font-family:"GmarketSans";font-weight:300;font-display:swap;src:local("GmarketSansLight"),local("Gmarket Sans Light"),local("GmarketSansTTFLight"),url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff") format("woff")}
@font-face{font-family:"GmarketSans";font-weight:500;font-display:swap;src:local("GmarketSansMedium"),local("Gmarket Sans Medium"),local("GmarketSansTTFMedium"),url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff") format("woff")}
@font-face{font-family:"GmarketSans";font-weight:700;font-display:swap;src:local("GmarketSansBold"),local("Gmarket Sans Bold"),local("GmarketSansTTFBold"),url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff") format("woff")}
:root{
  --bg:#434341; --bg-deep:#3b3b39; --card:rgba(255,255,255,.035); --grain:#3e403d;
  --ink:#bbbdaf; --hi:#d3d5c8; --muted:#aeafa9; --dim:#8e8f88; --line:#5a5b55; --soft:#4b4b48;
  --taupe:#837c72; --warm:#b39b86; --red:#e0907d; --red-soft:#5a4440;
  --glow-h:linear-gradient(90deg,transparent,#5e5348 35%,#d9d6c8 75%,transparent);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"GmarketSans","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--ink);color:var(--bg)}
.top{background:var(--bg);padding:16px 28px 12px;position:sticky;top:0;z-index:20}
.top .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--muted)}
.top .mk{width:30px;height:25px;flex:none;cursor:pointer;background:none;border:none;padding:0}
.top .mk img{width:100%;height:100%;display:block}
.top .ttl{font-weight:300;letter-spacing:-.01em}
.top .ln{flex:1;height:1px;background:#b5b6ad;min-width:20px}
.top .ttl{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.top .back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:11.5px;cursor:pointer;flex:none}
.demo{background:var(--taupe);color:#211d19;text-align:center;font-size:11.5px;padding:5px 10px;font-weight:500}
main{max-width:880px;margin:0 auto;padding:14px 28px 40px;position:relative}
h1{font-size:18.5px;line-height:1.3;margin:6px 0 8px;letter-spacing:-.02em;font-weight:700;color:var(--ink)}
h2{font-size:16.5px;margin:0 0 10px;letter-spacing:-.01em;font-weight:700}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
b,strong{font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.notice{white-space:pre-wrap;border-left:2px solid var(--taupe);padding:2px 0 2px 12px;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.chip.off{color:var(--dim)}
.chip.warn{border-color:var(--red);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--dim);background:transparent;color:var(--ink);border-radius:var(--r);padding:11px 16px;font-weight:500;cursor:pointer;text-decoration:none;min-height:44px}
.btn.primary,.btn.lime{background:var(--ink);border-color:var(--ink);color:#2f2f2d;font-weight:700}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.armed{background:var(--red);color:#2f2f2d}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.inp:focus-visible,.cell:focus-visible,.tabs button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:10px}
label.f{display:block;font-size:11.5px;font-weight:500;margin:0 0 6px;color:var(--muted)}
.inp{width:100%;border:1px solid #6c6d66;border-radius:10px;padding:10px 12px;background:var(--bg-deep);color:var(--ink);min-height:44px;font-size:15px}
.inp:focus{outline:none;border-color:var(--ink)}
.inp::placeholder{color:var(--dim)}
.inp:disabled{opacity:.6}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:auto;color-scheme:dark}
input[type=date].inp{color-scheme:dark}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.err{color:var(--red);font-size:12px;margin-top:6px;min-height:1em}
.hr{height:1px;background:var(--line);margin:16px 0}
.glow{height:2px;background:var(--glow-h);margin:12px -28px 0}
.foot{text-align:center;color:var(--dim);font-size:11px;padding:10px 0 30px;position:relative;z-index:1}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11.5px;padding:6px}

/* 첫 화면 */
.hero{display:block;width:calc(72% + 28px);max-width:400px;height:auto;margin:18px 0 clamp(28px,9vh,90px) 0}
.grain{position:fixed;right:0;bottom:0;width:min(100%,1100px);pointer-events:none;z-index:0}
.grain img{width:100%;height:auto;display:block}
main>*{position:relative;z-index:1}
.when{font-size:12.5px;font-weight:500;line-height:1.8;margin:6px 0 0;color:var(--muted);letter-spacing:-.01em}

/* 시간 격자 */
.gwrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.tgrid{display:grid;gap:4px;user-select:none;-webkit-user-select:none;min-width:100%}
.tgrid .hd{font-size:11px;font-weight:700;text-align:center;line-height:1.25;padding:2px 0 4px}
.tgrid .hd .wd{display:block;font-weight:400;color:var(--muted)}
.tgrid .hd.sun,.tgrid .hd.sun .wd{color:var(--red)}
.tgrid .hl{font-size:11px;color:var(--muted);text-align:right;padding-right:4px;transform:translateY(-8px);font-variant-numeric:tabular-nums}
.tgrid .allday{display:block;margin:5px auto 0;font-size:11px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 6px;cursor:pointer;font-weight:500;color:var(--muted)}
.cell{height:40px;border-radius:7px;background:var(--bg-deep);border:1px solid var(--line);touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .08s;color:var(--ink)}
.cell.on{background:var(--ink);border-color:var(--hi)}
.cell.x{background:repeating-linear-gradient(135deg,transparent 0 5px,#474844 5px 10px);border-color:transparent;cursor:default}
.cell.heat{cursor:pointer;touch-action:auto}
.cell.short{box-shadow:inset 0 0 0 2px var(--red)}
.cell.pick{outline:2px solid var(--hi);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line);background:var(--bg-deep)}
.sumline{font-size:12px;margin-top:10px}
.sumline b{font-variant-numeric:tabular-nums}

/* 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{flex:1;border:none;background:none;padding:10px 10px 11px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:none;padding:6px 14px;font-size:12px;color:var(--dim);cursor:pointer;min-height:36px}
.seg button.on{background:var(--ink);color:#2f2f2d;font-weight:700}

/* 시간표: 목록 */
.day{margin:0 0 14px}
.day h3{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.slot{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:none}
.slot .tm{width:104px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.slot .ppl{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.slot.edit{cursor:pointer;border-radius:10px;margin:0 -8px;padding:10px 8px}
.slot.edit:hover{background:var(--soft)}
.slot.open{background:var(--soft)}
.pp{border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:500}
.pp.me{background:var(--ink);border-color:var(--ink);color:#2f2f2d;font-weight:700}
.pp.miss{border-style:dashed;border-color:var(--warm);color:var(--warm);font-size:11.5px}
.editbox{background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px}
.ck{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px;cursor:pointer}
.ck:hover{background:var(--soft)}
.ck input{width:20px;height:20px;accent-color:var(--ink)}
.ck .ld{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 시간표: 표 */
.ttab{width:100%;border-collapse:collapse;table-layout:fixed}
.ttab th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:0 6px 7px}
.ttab th.sun{color:var(--red)}
.ttab td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top;font-size:12px;line-height:1.6}
.ttab td.t{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttab td.none{background:repeating-linear-gradient(135deg,transparent 0 5px,#454642 5px 10px)}
.ttab .me{background:var(--ink);color:#2f2f2d;border-radius:4px;padding:0 5px;font-weight:700}
.ttab .miss{color:var(--warm);font-size:11px}
.ttwrap{overflow-x:auto;margin:0 -6px}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11.5px;color:var(--muted);font-weight:500}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sel td{background:var(--soft)}
table.t tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
table.t tr.click{cursor:pointer}
.bar{height:6px;background:var(--bg-deep);border-radius:3px;overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;background:var(--ink)}
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dayrow .inp{min-height:40px;padding:6px 8px}
.x-btn{border:none;background:var(--soft);border-radius:10px;height:40px;cursor:pointer;font-size:16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#2f2f2d;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats>div{border-top:1px solid var(--line);padding:10px 2px 0}
.stats .lb{font-size:11px;color:var(--muted)}
.mylist{margin:8px 0 0;padding:0;list-style:none}
.mylist li{padding:4px 0;font-weight:700}
details>summary{cursor:pointer;color:var(--muted);font-size:12px;padding:6px 0}
@media (max-width:560px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .slot .tm{width:92px;font-size:12px}
  .stats .big{font-size:19px}
  .dayrow{grid-template-columns:minmax(0,1fr) 78px 78px 36px}
}
@media (max-width:480px){ .top .en{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"><img src="poster-grain.jpg" alt=""></div>
<header class="top"><div class="in">
  <button class="mk" aria-label="처음으로" onclick="go('')"><img src="poster-logo.png" alt=""></button>
  <span class="ln"></span>
  <span class="ttl" onclick="go('')">목방 제 40회 전시회<span class="en"> MOKBANG 40th Exhibition</span></span>
  <button class="back" id="backBtn" style="display:none" onclick="go('')">처음으로</button>
</div></header>
<div id="demoBar"></div>
<main id="app"><div class="loading">불러오는 중…</div></main>
<div class="foot" id="foot"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
/* ============ 기본 ============ */
const API = (window.SANGJU_API || '').trim();
const DEMO = !API;
const WD = '일월화수목금토';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = (d, h) => d + '|' + h;
const normName = s => String(s || '').replace(/\s+/g, '');
const pad = n => String(n).padStart(2, '0');
const fmtH = h => pad(h) + ':00';
function dObj(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd); }
function fmtDate(d){ const t = dObj(d); return `${t.getMonth()+1}/${t.getDate()} (${WD[t.getDay()]})`; }
function isSun(d){ return dObj(d).getDay() === 0; }
function fmtRange(s, e){ return `${fmtH(s)}–${fmtH(e)}`; }
function baseUrl(){ return location.origin + location.pathname; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
async function copyText(txt, msg){
  try { await navigator.clipboard.writeText(txt); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(_){} ta.remove(); }
  toast(msg || '복사했어요');
}
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function ssSet(k, v){ try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch(e){} }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hoursText(h){ return Number.isInteger(h) ? h + '시간' : h.toFixed(1) + '시간'; }

async function api(action, data = {}){
  if (DEMO) { await new Promise(r => setTimeout(r, 180)); return Mock.handle(Object.assign({action}, JSON.parse(JSON.stringify(data)))); }
  let res;
  try { res = await fetch(API, {method:'POST', body: JSON.stringify(Object.assign({action}, data))}); }
  catch(e){ throw new Error(navigator.onLine === false ? '인터넷에 연결되어 있지 않아요' : '서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요'); }
  let j; try { j = await res.json(); } catch(e){ throw new Error('서버 응답을 읽지 못했어요 (앱스 스크립트 배포 설정을 확인해 주세요)'); }
  if (!j.ok) throw new Error(j.error || '오류가 났어요');
  return j.data;
}

/* ============ 시간·배분 계산 (서버 Code.gs와 같은 규칙) ============ */
function hourSpan(days){ let lo = 24, hi = 0; days.forEach(d => { if (d.close > d.open){ lo = Math.min(lo, d.open); hi = Math.max(hi, d.close); } }); return lo < hi ? [lo, hi] : [10, 18]; }
function validKeys(days){ const s = new Set(); days.forEach(d => { for (let h = d.open; h < d.close; h++) s.add(key(d.date, h)); }); return s; }
function rangesOf(set, days){
  const out = [];
  days.forEach(d => {
    const rs = []; let st = null;
    for (let h = d.open; h <= d.close; h++){
      const on = h < d.close && set.has(key(d.date, h));
      if (on && st == null) st = h;
      if (!on && st != null){ rs.push([st, h]); st = null; }
    }
    if (rs.length) out.push({date: d.date, rs});
  });
  return out;
}
function rangesText(set, days){ return rangesOf(set, days).map(x => fmtDate(x.date) + ' ' + x.rs.map(r => fmtRange(r[0], r[1])).join(', ')).join('\n'); }
const LEN_OPTS = [1, 2, 3, 4, 'half'];
function lenLabel(L){ return L === 'half' ? '반나절 (하루 2타임)' : L + '시간'; }
function buildSlots(days, L){
  const out = [];
  days.forEach(d => {
    const span = d.close - d.open; if (span <= 0) return;
    const len = L === 'half' ? Math.ceil(span / 2) : +L;
    for (let s = d.open; s < d.close; s += len){ const e = Math.min(s + len, d.close); out.push({date: d.date, start: s, end: e, h: e - s}); }
  });
  return out;
}
function prepPeople(resps, days){
  const v = validKeys(days);
  return resps.map(r => ({sid: r.sid, name: r.name, set: new Set((r.avail || []).filter(k => v.has(k)))})).filter(p => p.set.size);
}
function canDo(p, s){ for (let h = s.start; h < s.end; h++) if (!p.set.has(key(s.date, h))) return false; return true; }
function candOf(s, people){ return people.filter(p => canDo(p, s)).map(p => p.sid); }
function neighbors(slots){
  const n = slots.length;
  return slots.map((s, i) => ({
    prev: i > 0 && slots[i-1].date === s.date && slots[i-1].end === s.start ? i - 1 : -1,
    next: i < n - 1 && slots[i+1].date === s.date && slots[i+1].start === s.end ? i + 1 : -1
  }));
}
/* 균등 배분: 사람 부족한 자리를 먼저 채우고, 각자 맡은 시간이 고르게 되도록(제곱합 최소) 바꿔 보기를 되풀이해요 */
function solve(slots, people, k, mode, seed){
  const n = slots.length;
  const cand = slots.map(s => candOf(s, people));
  const nb = neighbors(slots);
  const avgH = n ? slots.reduce((a, s) => a + s.h, 0) / n : 1;
  const W = mode === 'join' ? -avgH * avgH * 0.9 : mode === 'apart' ? avgH * avgH * 1.5 : 0;
  let best = null;
  for (let r = 0; r < 30; r++){
    const rnd = mulberry32(seed * 7919 + r + 1);
    const asg = slots.map(() => []); const load = {}; people.forEach(p => load[p.sid] = 0);
    const adj = (i, sid) => (nb[i].prev >= 0 && asg[nb[i].prev].includes(sid) ? 1 : 0) + (nb[i].next >= 0 && asg[nb[i].next].includes(sid) ? 1 : 0);
    const tie = slots.map(() => rnd());
    const order = [...slots.keys()].sort((a, b) => (cand[a].length - cand[b].length) || (tie[a] - tie[b]));
    for (const i of order){
      const pool = cand[i].slice();
      while (asg[i].length < k && pool.length){
        let bj = 0, bv = Infinity;
        for (let j = 0; j < pool.length; j++){ const sid = pool[j], l = load[sid]; const v = (l + slots[i].h) ** 2 - l * l + W * adj(i, sid) + rnd() * 0.8; if (v < bv){ bv = v; bj = j; } }
        const sid = pool.splice(bj, 1)[0]; asg[i].push(sid); load[sid] += slots[i].h;
      }
    }
    let improved = true, pass = 0;
    while (improved && pass++ < 80){
      improved = false;
      for (let i = 0; i < n; i++){
        const h = slots[i].h;
        for (let a = 0; a < asg[i].length; a++){
          const p = asg[i][a];
          for (const q of cand[i]){
            if (asg[i].includes(q)) continue;
            const lp = load[p], lq = load[q];
            const d = ((lp - h) ** 2 + (lq + h) ** 2) - (lp * lp + lq * lq) + W * (adj(i, q) - adj(i, p));
            if (d < -1e-9){ asg[i][a] = q; load[p] -= h; load[q] += h; improved = true; break; }
          }
        }
      }
    }
    const objective = () => {
      let unfilled = 0, sq = 0, adjT = 0;
      asg.forEach((x, i) => { unfilled += Math.max(0, k - x.length); if (nb[i].next >= 0) x.forEach(sid => { if (asg[nb[i].next].includes(sid)) adjT++; }); });
      Object.values(load).forEach(l => sq += l * l);
      return unfilled * 1e9 + sq + W * adjT;
    };
    // 이어 바꾸기: 많이 맡은 사람 → A가 대신 → A의 다른 타임은 B가 대신 … → 적게 맡은 사람
    let cur = objective(), guard = 0, changed = true;
    while (changed && guard++ < 300){
      changed = false;
      const order2 = Object.keys(load).sort((a, b) => load[b] - load[a]);
      for (const P of order2){
        const prev = {}; prev[P] = null; const queue = [P];
        while (queue.length && !changed){
          const A = queue.shift();
          for (let i = 0; i < n && !changed; i++){
            if (!asg[i].includes(A)) continue;
            for (const B of cand[i]){
              if (B in prev || asg[i].includes(B)) continue;
              prev[B] = {from: A, slot: i}; queue.push(B);
              if (load[B] + slots[i].h >= load[P]) continue;
              const saveA = asg.map(x => x.slice()), saveL = Object.assign({}, load);
              let x = B;
              while (prev[x]){ const st = prev[x]; const s = asg[st.slot]; s[s.indexOf(st.from)] = x; load[st.from] -= slots[st.slot].h; load[x] += slots[st.slot].h; x = st.from; }
              const nv = objective();
              if (nv < cur - 1e-9){ cur = nv; changed = true; break; }
              saveA.forEach((v, j) => asg[j] = v); Object.assign(load, saveL);
            }
          }
        }
        if (changed) break;
      }
    }
    const score = cur;
    if (!best || score < best.score - 1e-9) best = {score, asg: asg.map(x => x.slice())};
  }
  return best ? best.asg : [];
}
function compareLens(days, people, k){
  return LEN_OPTS.map(L => {
    const slots = buildSlots(days, L);
    const lens = new Set(slots.map(s => s.h));
    const need = slots.reduce((a, s) => a + s.h * k, 0);
    const short = slots.filter(s => candOf(s, people).length < k).length;
    return {L, n: slots.length, need, per: people.length ? need / people.length : 0, perSlots: people.length ? slots.length * k / people.length : 0, short, lens};
  }).filter(x => {
    // 반나절이 1~4시간 보기와 똑같이 나오면 빼요
    if (x.L !== 'half') return true;
    return !(x.lens.size === 1 && [1, 2, 3, 4].includes([...x.lens][0]));
  });
}
function loadsOf(result){
  const m = {};
  (result.slots || []).forEach(s => (s.sids || []).forEach(sid => { m[sid] = m[sid] || {n: 0, h: 0}; m[sid].n++; m[sid].h += s.end - s.start; }));
  return m;
}
function displayNames(result){
  // 같은 이름이 둘이면 학번 뒤 2자리를 붙여요
  const names = result.names || {}; const cnt = {};
  Object.values(names).forEach(n => cnt[normName(n)] = (cnt[normName(n)] || 0) + 1);
  const out = {};
  Object.entries(names).forEach(([sid, n]) => out[sid] = cnt[normName(n)] > 1 ? `${n}(${sid.slice(-2)})` : n);
  return out;
}

const HERO = {hanja: '溫刻', name: '온각', tag: '차가운 계절에 새긴 따스함'};
function periodLines(days){
  // 시간이 같은 날끼리 묶어요: 12월 24–25일 11:00–18:00
  const out = [];
  days.forEach(d => {
    const last = out[out.length - 1], t = dObj(d.date);
    const prev = last && dObj(last.to.date); if (prev) prev.setDate(prev.getDate() + 1);
    if (last && last.open === d.open && last.close === d.close && prev && iso(prev) === d.date) last.to = d;
    else out.push({from: d, to: d, open: d.open, close: d.close});
  });
  return out.map(g => {
    const f = dObj(g.from.date), t = dObj(g.to.date);
    const ds = g.from === g.to ? `${f.getMonth()+1}월 ${f.getDate()}일` : (f.getMonth() === t.getMonth() ? `${f.getMonth()+1}월 ${f.getDate()}–${t.getDate()}일` : `${f.getMonth()+1}월 ${f.getDate()}일 – ${t.getMonth()+1}월 ${t.getDate()}일`);
    return `${ds} ${fmtRange(g.open, g.close)}`;
  });
}

/* 시간 격자 그리기 — mode: edit(칠하기) / view(보기) / heat(몇 명 가능한지) */
function drawGrid(el, days, o){
  const [lo, hi] = hourSpan(days);
  const cols = days.length;
  el.className = 'tgrid';
  el.style.gridTemplateColumns = `44px repeat(${cols}, minmax(${cols > 6 ? 46 : 52}px, 1fr))`;
  let html = '<div></div>';
  days.forEach(d => {
    const t = dObj(d.date);
    html += `<div class="hd ${isSun(d.date) ? 'sun' : ''}">${t.getMonth()+1}/${t.getDate()}<span class="wd">${WD[t.getDay()]}</span>${o.mode === 'edit' ? `<button class="allday" data-day="${d.date}">하루 종일</button>` : ''}</div>`;
  });
  for (let h = lo; h < hi; h++){
    html += `<div class="hl">${fmtH(h)}</div>`;
    days.forEach(d => {
      const k = key(d.date, h);
      if (h < d.open || h >= d.close){ html += `<div class="cell x"></div>`; return; }
      if (o.mode === 'heat'){
        const n = o.counts[k] || 0; const a = o.max ? n / o.max : 0;
        const bg = n ? `rgba(196,198,183,${0.1 + a * 0.85})` : 'var(--bg-deep)';
        html += `<div class="cell heat ${n < o.k ? 'short' : ''} ${o.pick === k ? 'pick' : ''}" data-k="${k}" style="background:${bg};${a > 0.5 ? 'color:#2f2f2d' : ''}">${n}</div>`;
      } else {
        html += `<div class="cell ${o.sel.has(k) ? 'on' : ''}" data-k="${k}"></div>`;
      }
    });
  }
  el.innerHTML = html;
  if (o.mode === 'heat'){ el.onclick = e => { const c = e.target.closest('.cell[data-k]'); if (c && o.onPick) o.onPick(c.dataset.k); }; return; }
  if (o.mode !== 'edit') return;
  let painting = false, val = true;
  const apply = c => { if (!c || !c.dataset.k) return; const k = c.dataset.k; if (val) o.sel.add(k); else o.sel.delete(k); c.classList.toggle('on', val); };
  el.addEventListener('pointerdown', e => {
    const c = e.target.closest('.cell[data-k]'); if (!c) return;
    e.preventDefault(); painting = true; val = !o.sel.has(c.dataset.k); apply(c);
    try { el.setPointerCapture(e.pointerId); } catch(_){}
  });
  el.addEventListener('pointermove', e => {
    if (!painting) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    apply(t && t.closest && t.closest('.cell[data-k]'));
  });
  const end = () => { if (painting){ painting = false; o.onChange && o.onChange(); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  el.querySelectorAll('.allday').forEach(b => b.addEventListener('click', () => {
    const d = days.find(x => x.date === b.dataset.day);
    const ks = []; for (let h = d.open; h < d.close; h++) ks.push(key(d.date, h));
    const all = ks.every(k => o.sel.has(k));
    ks.forEach(k => all ? o.sel.delete(k) : o.sel.add(k));
    el.querySelectorAll('.cell[data-k]').forEach(c => c.classList.toggle('on', o.sel.has(c.dataset.k)));
    o.onChange && o.onChange();
  }));
}

function iso(t){ return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; }
function fillRange(){
  const f = $('#sFrom').value, t = $('#sTo').value; const c = S.cfgEdit;
  if (!f || !t) return toast('시작·끝 날짜를 골라 주세요');
  if (t < f) return toast('끝 날짜가 시작 날짜보다 빨라요');
  const o = +$('#sOpenH').value, cl = +$('#sCloseH').value;
  if (cl <= o) return toast('닫는 시간이 여는 시간보다 늦어야 해요');
  c.defOpen = o; c.defClose = cl;
  const old = Object.fromEntries(c.days.map(d => [d.date, d]));
  const days = []; for (let x = dObj(f); iso(x) <= t; x.setDate(x.getDate() + 1)){ const ds = iso(x); days.push(old[ds] || {date: ds, open: o, close: cl}); if (days.length > 31) break; }
  c.days = days; drawDays();
}
function addDay(){
  const d = $('#sAdd').value; const c = S.cfgEdit; if (!d) return;
  if (c.days.some(x => x.date === d)) return toast('이미 있는 날짜예요');
  c.days.push({date: d, open: +$('#sOpenH').value, close: +$('#sCloseH').value});
  c.days.sort((a, b) => a.date < b.date ? -1 : 1); drawDays();
}
async function saveCfg(){
  const c = S.cfgEdit; const err = $('#sErr'); err.textContent = '';

  c.k = +$('#sK').value; c.defOpen = +$('#sOpenH').value; c.defClose = +$('#sCloseH').value;
  const bad = c.days.find(d => d.close <= d.open);
  if (bad) return err.textContent = `${fmtDate(bad.date)}: 닫는 시간이 여는 시간보다 늦어야 해요`;
  const b = $('#sSave'); b.disabled = true; b.textContent = '저장하는 중…';

  catch(e){ err.textContent = e.message; b.disabled = false; b.textContent = '설정 저장하기'; }
}

/* --- 배분 · 공개 --- */
function tabDist(){
  const A = S.admin, c = A.cfg;
  if (!c.days.length){ $('#tab').innerHTML = '<div class="card"><p class="muted">설정 탭에서 날짜를 먼저 정해 주세요.</p></div>'; return; }

  if (!S.distOpt) S.distOpt = {L: (A.result && A.result.L) || 2, mode: (A.result && A.result.mode) || 'any', seed: 1};
  const cmp = compareLens(c.days, people, c.k);
  if (!cmp.some(x => String(x.L) === String(S.distOpt.L))) S.distOpt.L = cmp[0].L;
  const D = S.draft;
  const stale = D ? A.responses.filter(r => r.updated > D.made).length : 0;
  const gone = D ? Object.keys(D.names || {}).filter(sid => !A.responses.some(r => r.sid === sid)).length : 0;
  $('#tab').innerHTML = `
  <div class="card">
    <h2>1. 몇 시간씩 나눌까요?</h2>
    <p class="muted small" style="margin-top:-4px">응답 ${people.length}명 · 한 타임 ${c.k}명 기준이에요. 줄을 눌러 골라요.</p>
    <table class="t"><thead><tr><th>타임 길이</th><th class="n">타임 수</th><th class="n">1인당 평균</th><th class="n">${c.k}명 안 되는 타임</th></tr></thead><tbody>
    ${cmp.map(x => `<tr class="click ${String(x.L) === String(S.distOpt.L) ? 'sel' : ''}" data-len="${x.L}"><td><b>${esc(lenLabel(x.L))}</b></td><td class="n">${x.n}개</td><td class="n">${people.length ? `${x.perSlots.toFixed(1)}타임 · ${x.per.toFixed(1)}시간` : '-'}</td><td class="n" style="${x.short ? 'color:var(--red);font-weight:700' : ''}">${x.short}개</td></tr>`).join('')}
    </tbody></table>
    <div class="hr"></div>
    <label class="f" for="dMode">같은 사람의 타임을</label>
    <select class="inp" id="dMode" style="max-width:360px">
      <option value="any" ${S.distOpt.mode === 'any' ? 'selected' : ''}>상관없이 고르게만</option>
      <option value="join" ${S.distOpt.mode === 'join' ? 'selected' : ''}>가능하면 이어 붙이기 (한 번 올 때 길게)</option>
      <option value="apart" ${S.distOpt.mode === 'apart' ? 'selected' : ''}>가능하면 떨어뜨리기 (연달아 안 하게)</option>
    </select>
    <p class="muted small">1시간 타임이면 '이어 붙이기'를 추천해요.</p>
    <button class="btn primary block" id="dRun" ${people.length ? '' : 'disabled'}>${D ? '이 조건으로 다시 나누기' : '균등하게 나누기'}</button>
    ${people.length ? '' : '<p class="muted small">응답이 모이면 나눌 수 있어요.</p>'}
  </div>
  <div id="dRes"></div>`;
  document.querySelectorAll('tr[data-len]').forEach(tr => tr.onclick = () => { S.distOpt.L = tr.dataset.len === "half" ? "half" : +tr.dataset.len; S.distOpt.mode = $('#dMode').value; tabDist(); });
  $('#dMode').onchange = () => S.distOpt.mode = $('#dMode').value;
  $('#dRun').onclick = () => {
    S.distOpt.mode = $('#dMode').value;
    if (S.draft) S.distOpt.seed++;
    const slots = buildSlots(c.days, S.distOpt.L);
    const asg = solve(slots, people, c.k, S.distOpt.mode, S.distOpt.seed);
    S.draft = {L: S.distOpt.L, k: c.k, mode: S.distOpt.mode, made: Date.now(), saved: false,
      slots: slots.map((s, i) => ({date: s.date, start: s.start, end: s.end, sids: asg[i] || []})),
      names: Object.fromEntries(A.responses.map(r => [r.sid, r.name]))};

  };
  if (D) drawResult(people, stale, gone);
}
function drawResult(people, stale, gone){
  const A = S.admin, D = S.draft; const k = D.k;
  const names = Object.assign({}, D.names, Object.fromEntries(A.responses.map(r => [r.sid, r.name])));
  D.names = names;
  const loads = loadsOf(D);
  const allSids = [...new Set([...people.map(p => p.sid), ...Object.keys(loads)])];
  const hs = allSids.map(s => (loads[s] || {h: 0}).h);
  const minH = Math.min(...hs), maxH = Math.max(...hs);
  const missing = D.slots.reduce((a, s) => a + Math.max(0, k - s.sids.length), 0);
  const byDay = {}; D.slots.forEach((s, i) => (byDay[s.date] = byDay[s.date] || []).push(i));
  const isPub = A.published && A.result && A.result.made === D.made && !D.dirty;
  const dn = displayNames(D);
  $('#dRes').innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">2. 나눈 결과</h2>
      <div class="row"><span class="chip ${isPub ? 'on' : D.saved && !D.dirty ? '' : 'warn'}">${isPub ? '공개 중' : D.saved && !D.dirty ? '저장됨 · 비공개' : '아직 저장 안 됨'}</span>
      <div class="seg" id="rSeg"><button data-v="list" class="${S.rview !== 'table' ? 'on' : ''}">목록</button><button data-v="table" class="${S.rview === 'table' ? 'on' : ''}">표</button></div></div>
    </div>
    <p class="muted small">${esc(lenLabel(D.L))} 단위 · 한 타임 ${k}명 · 1인당 <b>${hoursText(minH)} ~ ${hoursText(maxH)}</b>${missing ? ` · <b style="color:var(--red)">빈자리 ${missing}개</b>` : ''}</p>
    ${stale || gone ? `<p class="small" style="color:var(--red);margin:0 0 6px">나눈 뒤에 응답이 바뀐 사람이 ${stale + gone}명 있어요. 다시 나누는 게 좋아요.</p>` : ''}
    ${S.rview === 'table' ? `<p class="muted small" style="margin:0 0 10px">사람을 바꾸려면 [목록]에서 타임을 눌러요.</p>${timetableHTML(D.slots.map(s => ({date: s.date, start: s.start, end: s.end, names: s.sids.map(sid => dn[sid] || sid)})), k, () => false)}` : `<p class="muted small" style="margin:0 0 6px">타임을 누르면 사람을 바꿀 수 있어요.</p>
    ${Object.keys(byDay).map(d => `<div class="day"><h3 style="margin-top:14px">${esc(fmtDate(d))}</h3>
      ${byDay[d].map(i => { const s = D.slots[i]; return `<div class="slot edit ${S.editSlot === i ? 'open' : ''}" data-i="${i}"><div class="tm">${fmtRange(s.start, s.end)}</div><div class="ppl">${s.sids.map(sid => `<span class="pp">${esc(names[sid] || sid)}</span>`).join('')}${s.sids.length < k ? `<span class="pp miss">${k - s.sids.length}명 부족</span>` : ''}</div></div>${S.editSlot === i ? editBox(i, people, loads) : ''}`; }).join('')}
    </div>`).join('')}`}
  </div>
  <div class="card">
    <h2>사람마다 맡은 시간</h2>
    <table class="t"><thead><tr><th>이름</th><th class="n">타임</th><th class="n">시간</th><th class="n">가능했던</th><th style="width:30%"></th></tr></thead><tbody>
    ${allSids.map(sid => ({sid, l: loads[sid] || {n: 0, h: 0}, p: people.find(x => x.sid === sid)})).sort((a, b) => b.l.h - a.l.h || (names[a.sid] || '').localeCompare(names[b.sid] || '')).map(x => `
      <tr><td><b>${esc(names[x.sid] || x.sid)}</b></td><td class="n">${x.l.n}</td><td class="n">${hoursText(x.l.h)}</td><td class="n muted">${x.p ? x.p.set.size + '시간' : '-'}</td><td><div class="bar"><i style="width:${maxH ? x.l.h / maxH * 100 : 0}%"></i></div></td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="err" id="dErr"></div>
  <div class="stack">
    <button class="btn lime block" id="dPub">저장하고 부원들에게 공개하기</button>
    <div class="grid2"><button class="btn block" id="dSave">저장만 하기 (비공개)</button>${A.published ? '<button class="btn block danger" id="dUnpub">공개 내리기</button>' : '<button class="btn block ghost" id="dCopy">단톡방 공지글 복사</button>'}</div>
    ${A.published ? '<button class="btn block ghost" id="dCopy">단톡방 공지글 복사</button>' : ''}
  </div>`;
  document.querySelectorAll('#rSeg button').forEach(b => b.onclick = () => { S.rview = b.dataset.v; drawResult(people, stale, gone); });
  document.querySelectorAll('.slot.edit').forEach(el => el.onclick = () => { const i = +el.dataset.i; S.editSlot = S.editSlot === i ? -1 : i; drawResult(people, stale, gone); });
  document.querySelectorAll('.editbox input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const s = D.slots[S.editSlot]; const sid = cb.dataset.sid;
    if (cb.checked){ if (!s.sids.includes(sid)) s.sids.push(sid); } else s.sids = s.sids.filter(x => x !== sid);
    D.dirty = true; drawResult(people, stale, gone);
  });
  const save = async publish => {
    const err = $('#dErr'); err.textContent = '';
    const btn = publish ? $('#dPub') : $('#dSave'); const t = btn.textContent; btn.disabled = true; btn.textContent = '저장하는 중…';
    try {
      const out = Object.assign({}, D); delete out.dirty; delete out.saved;
      await api('saveResult', {pw: S.pw, result: out, publish});
      await adminReload(); await loadPub();
      S.draft = JSON.parse(JSON.stringify(S.admin.result)); S.draft.saved = true;
      toast(publish ? '공개했어요. 부원들이 첫 화면에서 볼 수 있어요' : '저장했어요 (아직 비공개)');
      drawResult(people, 0, 0);
    } catch(e){ err.textContent = e.message; btn.disabled = false; btn.textContent = t; }
  };
  $('#dPub').onclick = () => save(true);
  $('#dSave').onclick = () => save(false);
  if ($('#dUnpub')) $('#dUnpub').onclick = async () => {
    try { await api('unpublish', {pw: S.pw}); await adminReload(); await loadPub(); S.draft.saved = true; toast('공개를 내렸어요'); drawResult(people, stale, gone); } catch(e){ toast(e.message); }
  };
  $('#dCopy').onclick = () => copyText(resultText(D), '시간표 공지글을 복사했어요');
}
function editBox(i, people, loads){
  const D = S.draft, s = D.slots[i];
  const can = people.filter(p => canDo(p, s));
  const cannot = Object.keys(D.names).filter(sid => !can.some(p => p.sid === sid));
  const row = (sid, warn) => `<label class="ck"><input type="checkbox" data-sid="${esc(sid)}" ${s.sids.includes(sid) ? 'checked' : ''}> <span>${esc(D.names[sid] || sid)}${warn ? ' <span class="chip warn">가능 시간 아님</span>' : ''}</span><span class="ld">지금 ${hoursText((loads[sid] || {h: 0}).h)}</span></label>`;
  return `<div class="editbox" onclick="event.stopPropagation()">
    <div class="small" style="font-weight:700;margin-bottom:4px">${esc(fmtDate(s.date))} ${fmtRange(s.start, s.end)} · ${s.sids.length}/${D.k}명</div>
    ${can.length ? can.sort((a, b) => (loads[a.sid] || {h: 0}).h - (loads[b.sid] || {h: 0}).h).map(p => row(p.sid, false)).join('') : '<p class="muted small">이 시간 전체가 되는 사람이 없어요.</p>'}
    ${cannot.length ? `<details ${cannot.some(sid => s.sids.includes(sid)) ? 'open' : ''}><summary>가능 시간이 아닌 사람도 넣기</summary>${cannot.map(sid => row(sid, true)).join('')}</details>` : ''}
  </div>`;
}
function resultText(D){
  const c = S.admin.cfg; const dn = displayNames(D);
  const byDay = {}; D.slots.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  return `[${c.title || '전시 상주'}] 상주 시간표\n` + Object.keys(byDay).map(d => `\n${fmtDate(d)}\n` + byDay[d].map(s => `${fmtRange(s.start, s.end)} ${s.sids.map(sid => dn[sid] || sid).join(', ')}`).join('\n')).join('\n') + `\n\n내 시간만 보기: ${baseUrl()}?v=t`;
}

/* ============ 미리보기용 가짜 서버 (서버 주소를 비웠을 때만 써요) ============ */
const Mock = {
  load(){
    let db = lsGet('sangju_demo_v2', null);
    if (!db){
      const days = ['2026-12-24','2026-12-25','2026-12-26'].map((d, i) => ({date: d, open: 11, close: i === 2 ? 17 : 18}));
      const names = ['장소현','김도윤','이서연','박지호','최하은','정민준','강유나','조현우','윤서아','임준서','한지우','오세린'];
      const rnd = mulberry32(42);
      const responses = names.map((n, i) => {
        const avail = [];
        days.forEach(d => { if (rnd() < 0.35) return; const a = d.open + Math.floor(rnd() * 4); const b = Math.min(d.close, a + 2 + Math.floor(rnd() * 6)); for (let h = a; h < b; h++) avail.push(key(d.date, h)); });
        return {sid: String(202311000 + i * 37), name: n, avail, memo: i === 2 ? '24일은 16시 전에 가야 해요' : '', created: Date.now() - 86400000, updated: Date.now() - 86400000};
      });
      db = {cfg: {title: '목방 제40회 전시회 온각 상주', notice: '제1학생회관 대회의실\n26일은 17시에 발표회가 있어서 상주는 17시까지예요. 가능한 시간을 넉넉히 칠해 주세요.', open: true, k: 2, defOpen: 11, defClose: 18, days}, responses, result: null, published: false, pw: '1234'};
      lsSet('sangju_demo_v2', db);
    }
    return db;
  },
  handle(q){
    const db = this.load(); const save = () => lsSet('sangju_demo_v2', db);
    const admin = () => { if (q.pw !== db.pw) throw new Error('비밀번호가 맞지 않아요'); };
    switch (q.action){
      case 'getPublic': return {count: db.responses.length, cfg: {title: db.cfg.title, notice: db.cfg.notice, open: db.cfg.open, k: db.cfg.k, days: db.cfg.days}, result: db.published && db.result ? publicResult(db.result) : null};
      case 'getMine': { const r = db.responses.find(x => x.sid === q.sid); if (!r) return null; if (normName(r.name) !== normName(q.name)) throw new Error('이 학번은 다른 이름으로 저장돼 있어요. 이름을 확인해 주세요'); return {avail: r.avail, memo: r.memo}; }
      case 'submit': {
        if (!db.cfg.open) throw new Error('지금은 받지 않아요');
        if (!/^\d{9}$/.test(q.sid)) throw new Error('학번은 9자리 숫자로 적어 주세요');
        const v = validKeys(db.cfg.days); const avail = [...new Set(q.avail)].filter(k => v.has(k));
        if (!avail.length) throw new Error('가능한 시간을 한 칸 이상 골라 주세요');
        let r = db.responses.find(x => x.sid === q.sid);
        if (r && normName(r.name) !== normName(q.name)) throw new Error('이 학번은 다른 이름으로 저장돼 있어요');
        if (!r){ r = {sid: q.sid, created: Date.now()}; db.responses.push(r); }
        Object.assign(r, {name: q.name.trim(), avail, memo: String(q.memo || '').slice(0, 300), updated: Date.now()}); save(); return true;
      }
      case 'adminGet': admin(); return {cfg: db.cfg, responses: db.responses, result: db.result, published: db.published};
      case 'saveConfig': admin(); db.cfg = q.cfg; save(); return true;
      case 'deleteResponse': admin(); db.responses = db.responses.filter(r => r.sid !== q.sid); save(); return true;
      case 'saveResult': admin(); db.result = q.result; db.published = !!q.publish; save(); return true;
      case 'unpublish': admin(); db.published = false; save(); return true;
      case 'changePw': admin(); db.pw = q.newPw; save(); return true;
    }
    throw new Error('알 수 없는 요청');
  }
};
function publicResult(r){ const dn = displayNames(r); return {L: r.L, k: r.k, made: r.made, slots: r.slots.map(s => ({date: s.date, start: s.start, end: s.end, names: s.sids.map(sid => dn[sid] || '')}))}; }

boot();
</script>
